{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameBox - Portal</title>
    <link rel="stylesheet" href="{% static "style.css" %}">
   
</head>
<body>
    <header class="header">
    <div class="logo">
        <a href="{% url 'game_list' %}">GameBox</a>
    </div>
    <div class="auth-buttons">
        {% if user.is_authenticated %}
        <div class="user-profile">
            <button class="profile-button" id="profile-button">
                Добро пожаловать ,{{ user.username }} !
            </button>
            <ul class="dropdown-menu">
                <li><a href="{% url 'profile' %}">Профиль</a></li>
                <li><a href="{% url 'logout' %}">Выход</a></li>
            </ul>
        </div>
        {% else %}
        <a href="{% url 'login' %}"><button>Bxoд</button></a>
        <a href="{% url 'register' %}"><button>Регистрация</button></a>
        {% endif %}
    </div>
    </header>

    <main>
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
        {% block content %}
        {% endblock %}
        


    </main>
    <footer>
        <p>Сайт защищен авторсими правами</p>
    </footer>
</body>
</html>
